<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="twitter-container">
        <i class="fab fa-twitter"></i>
        <h1>Twitter</h1>
    </div>
    
    <div class="login-container">
        <button class="login-button apple">
            <i class="fab fa-apple"></i>
            Войти с Apple
        </button>
        <button class="login-button google">
            <i class="fab fa-google"></i>
            Войти с Google
        </button>
        <button class="login-button github">
            <i class="fab fa-github"></i>
            Войти с GitHub
        </button>
        <div class="email-container">
            <input type="email" placeholder="Электронная почта" class="email-input">
        </div>
        <button class="next-button">Далее</button>
        <a href="#" class="register-link">Зарегистрироваться?</a>
    </div>

    <div class="register-container">
        <h2 class="register-title">Регистрация</h2>
        <button class="login-button apple">
            <i class="fab fa-apple"></i>
            Регистрация с Apple
        </button>
        <button class="login-button google">
            <i class="fab fa-google"></i>
            Регистрация с Google
        </button>
        <button class="login-button github">
            <i class="fab fa-github"></i>
            Регистрация с GitHub
        </button>
        <div class="email-container">
            <input type="email" placeholder="Электронная почта" class="email-input">
        </div>
        <button class="next-button">Далее</button>
        <div class="login-hint">
            <span>Уже зарегистрированы?</span>
            <button class="text-button">Войти</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
